<div class="timeline" #timelineContainer (scroll)="onScroll()">
  <div class="history-loader" *ngIf="hasOlderMessages || loadingOlderMessages">
    {{ loadingOlderMessages ? 'Загружаю предыдущие сообщения...' : 'Прокрутите выше, чтобы загрузить историю' }}
  </div>
  <div class="chat-empty" *ngIf="messages.length === 0">
    <strong>Готово к новой задаче</strong>
    <span>{{ emptyText }}</span>
  </div>
  <div class="msg" *ngFor="let message of messages" [class.user]="message.kind === 'user'" [class.assistant]="message.kind === 'assistant'" [class.event]="message.kind === 'event'" [class.reasoning]="message.kind === 'reasoning'">
    <div class="role">{{ message.role }}</div>
    <div class="body">{{ message.content }}</div>
  </div>
</div>
