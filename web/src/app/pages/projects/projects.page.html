<section class="projects-page">
  <header class="topbar">
    <h1>Проекты</h1>
    <div class="actions">
      <app-button variant="primary" (pressed)="addFormOpenChange.emit(!addFormOpen)">Добавить</app-button>
      <app-button (pressed)="refreshProjects.emit()">Обновить</app-button>
    </div>
  </header>

  <form class="add-project" *ngIf="addFormOpen" (ngSubmit)="addProject.emit()">
    <input name="projectPath" [ngModel]="projectPath" (ngModelChange)="projectPathChange.emit($event)" placeholder="Путь к проекту" />
    <app-button variant="primary" type="submit">OK</app-button>
  </form>

  <div class="notice error" *ngIf="error">{{ error }}</div>

  <div class="list" *ngIf="projects.length > 0; else emptyProjects">
    <article class="project" *ngFor="let project of projects" [class.active]="project.id === activeProjectId" (click)="openProject.emit(project)">
      <div class="project-info">
        <div class="project-name">
          {{ project.name }}
          <span *ngIf="project.id === activeProjectId">открыт</span>
        </div>
        <div class="project-path">{{ project.path }}</div>
      </div>
      <div class="project-buttons">
        <app-button variant="primary" (pressed)="openProject.emit(project); $event.stopPropagation()">Открыть</app-button>
        <app-button variant="danger" (pressed)="removeProject.emit({ project, event: $event }); $event.stopPropagation()">Убрать</app-button>
      </div>
    </article>
  </div>

  <ng-template #emptyProjects>
    <div class="empty">Нет проектов</div>
  </ng-template>
</section>
