<section class="screen active">
  <div class="tasks-page">
    <div class="tasks-shell">
      <div class="hero">
        <div>
          <div class="eyebrow">задачи проекта</div>
          <h1>{{ project?.name || 'Проект' }}</h1>
          <div class="subtitle">Выберите задачу, чтобы открыть её чат. Задача хранит контекст работы и историю сообщений; активный процесс не останавливается при переходах.</div>
        </div>
        <div class="project-actions">
          <app-button (pressed)="backToProjects.emit()">Проекты</app-button>
          <app-button (pressed)="refreshTasks.emit()">Обновить</app-button>
          <app-button variant="primary" (pressed)="newTask.emit()">Новая задача</app-button>
        </div>
      </div>

      <div class="notice error" *ngIf="error">{{ error }}</div>

      <div class="task-page-list" *ngIf="tasks.length > 0; else emptyTaskPage">
        <button class="task-page-card" type="button" *ngFor="let task of tasks" [class.active]="task.id === activeTaskId" (click)="openTask.emit(task.id)">
          <div>
            <strong>{{ task.title }}</strong>
            <span>{{ task.id === currentRunTaskId && currentRunId ? 'выполняется сейчас' : 'задача' }}</span>
          </div>
          <small>{{ task.id }}</small>
        </button>
      </div>

      <ng-template #emptyTaskPage>
        <div class="empty-card">Задач пока нет. Создайте первую задачу для этого проекта.</div>
      </ng-template>
    </div>
  </div>
</section>
