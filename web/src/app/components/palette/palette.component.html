<div class="overlay open" *ngIf="open">
  <div class="palette">
    <header>Меню</header>
    <div class="palette-list">
      <div class="palette-item" (click)="projects.emit()"><strong>Карточки проектов</strong><span>перейти к выбору проекта</span></div>
      <div class="palette-item" (click)="tasks.emit()"><strong>Задачи</strong><span>открыть список задач</span></div>
      <div class="palette-item" (click)="newTask.emit()"><strong>Новая задача</strong><span>создать пустую задачу</span></div>
      <div class="palette-item" *ngFor="let item of commands" (click)="selectCommand.emit(item.name)"><strong>{{ item.name }}</strong><span>{{ item.description || 'переключить процесс' }}</span></div>
      <div class="palette-item" (click)="stopRun.emit()"><strong>Остановить текущий запуск</strong><span>прервать provider</span></div>
    </div>
  </div>
</div>
